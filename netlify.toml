[build]
  publish = "build/"
  command = "npm test && python deploy.py --build-only && node hairhouse-build.cjs"

[functions]
  node_bundler = "esbuild"
  included_files = ["node_modules/pdfjs-dist/build/pdf.mjs", "node_modules/pdfjs-dist/build/pdf.worker.mjs"]

[[redirects]]
  from = "/hairhouse"
  to = "/hairhouse/index.html"
  status = 200
  force = true

# /index.html is a duplicate of / - consolidate with a 301
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; img-src 'self' https://www.google-analytics.com; connect-src 'self' https://www.google-analytics.com https://analytics.google.com;"
